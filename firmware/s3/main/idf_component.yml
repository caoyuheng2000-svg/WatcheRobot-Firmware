## IDF Component Manager Manifest File
## This file manages external dependencies for the main component
##
## Documentation: https://docs.espressif.com/projects/esp-idf/en/latest/esp32/api-guides/tools/idf-component-manager.html

dependencies:
  # LVGL - Light and Versatile Graphics Library
  # https://components.espressif.com/components/lvgl/lvgl
  lvgl/lvgl:
    version: "8.3.11"
    override_path: ../managed_components/lvgl__lvgl

  # ESP LVGL Port - LOCAL VERSION with custom encoder button event callbacks
  # Located at: components/esp_lvgl_port
  # Includes: lvgl_port_encoder_btn_register_event_cb
  #           lvgl_port_encoder_btn_register_event_data_cb

  # ESP IO Expander - For PCA95xx support
  # https://components.espressif.com/components/espressif/esp_io_expander
  espressif/esp_io_expander:
    version: "1.0.1"
    override_path: ../managed_components/espressif__esp_io_expander
    public: true

  espressif/esp_lcd_spd2010:
    version: "1.0.1"
    override_path: ../managed_components/espressif__esp_lcd_spd2010
    public: true

  espressif/esp_lcd_touch_spd2010:
    version: "0.0.1"
    override_path: ../managed_components/espressif__esp_lcd_touch_spd2010
    public: true

  espressif/esp_codec_dev:
    version: "1.2.0"
    override_path: ../managed_components/espressif__esp_codec_dev
    public: true

  espressif/led_strip:
    version: "2.5.4"
    override_path: ../managed_components/espressif__led_strip
    public: true

  espressif/button:
    version: "3.2.3"
    override_path: ../managed_components/espressif__button
    public: true

  espressif/knob:
    version: "0.1.4"
    override_path: ../managed_components/espressif__knob
    public: true

  espressif/esp_websocket_client:
    version: "1.2.3"
    override_path: ../managed_components/espressif__esp_websocket_client
    public: true
